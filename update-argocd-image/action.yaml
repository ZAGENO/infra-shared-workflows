name: 'Update Argo CD Image Tag'
description: 'Updates a Helm image tag in an Argo CD JSON patch and pushes the manifest repository'

inputs:
  repository:
    description: Manifest repository in owner/repository format
    required: true
  branch:
    description: Manifest branch watched by Argo CD
    required: false
    default: main
  token:
    description: GitHub token with contents write access to the manifest repository
    required: true
  manifest_path:
    description: Repository-relative path to the Argo CD JSON patch
    required: true
  helm_parameter_name:
    description: Helm image tag parameter to update
    required: true
  parameters_path:
    description: JSON patch path containing the Helm parameters
    required: false
    default: /spec/sources/0/helm/parameters
  image_tag:
    description: Published container image tag
    required: true

runs:
  using: composite
  steps:
    - name: Verify manifest repository access
      shell: bash
      env:
        MANIFEST_TOKEN: ${{ inputs.token }}
        MANIFEST_REPOSITORY: ${{ inputs.repository }}
        MANIFEST_BRANCH: ${{ inputs.branch }}
      run: |
        if [[ -z "$MANIFEST_TOKEN" ]]; then
          printf '::error::The manifest repository token is empty. Check the calling repository Actions secret and its availability to this job.\n' >&2
          exit 1
        fi

        if ! http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
          --output /dev/null --write-out '%{http_code}' \
          --header "Authorization: Bearer $MANIFEST_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --get --data-urlencode "ref=$MANIFEST_BRANCH" \
          --url "${GITHUB_API_URL:-https://api.github.com}/repos/$MANIFEST_REPOSITORY/contents/"); then
          printf '::error::Cannot reach the GitHub API. Check the runner DNS, proxy, TLS, and network access.\n' >&2
          exit 1
        fi

        case "$http_code" in
          200)
            printf 'Token can read the manifest repository contents on the requested branch.\n'
            ;;
          401)
            printf '::error::GitHub rejected the token (HTTP 401). Check that the secret contains an active PAT, not its name, URL, or a Bearer prefix.\n' >&2
            exit 1
            ;;
          403)
            printf '::error::GitHub denied repository access (HTTP 403). Check organization PAT approval, SSO authorization, IP restrictions, token permissions, and API rate limits.\n' >&2
            exit 1
            ;;
          404)
            printf '::error::Repository contents or branch are not visible to this token (HTTP 404). Check the token resource owner, selected repository, Contents permission, and branch name.\n' >&2
            exit 1
            ;;
          *)
            printf '::error::GitHub repository access check returned HTTP %s.\n' "$http_code" >&2
            exit 1
            ;;
        esac

    - name: Check out manifest repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}
        token: ${{ inputs.token }}
        path: argocd-manifests

    - name: Install yq
      shell: bash
      env:
        YQ_VERSION: v4.52.2
      run: |
        case "$RUNNER_OS" in
          Linux) platform=linux ;;
          macOS) platform=darwin ;;
          *) printf '::error::Unsupported runner OS: %s\n' "$RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) architecture=amd64 ;;
          ARM64) architecture=arm64 ;;
          *) printf '::error::Unsupported runner architecture: %s\n' "$RUNNER_ARCH" >&2; exit 1 ;;
        esac

        install_dir="$RUNNER_TEMP/argocd-yq-$YQ_VERSION"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location --retry 3 \
          --connect-timeout 10 --max-time 120 \
          --output "$install_dir/yq" \
          "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_${platform}_${architecture}"
        chmod +x "$install_dir/yq"
        "$install_dir/yq" --version
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

    - name: Update and push image tag
      shell: bash
      working-directory: ${{ github.workspace }}/argocd-manifests
      env:
        MANIFEST_PATH: ${{ inputs.manifest_path }}
        HELM_PARAMETER_NAME: ${{ inputs.helm_parameter_name }}
        PARAMETERS_PATH: ${{ inputs.parameters_path }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        BRANCH: ${{ inputs.branch }}
      run: |
        if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
          printf 'Invalid container image tag\n' >&2
          exit 1
        fi

        parameter_count=$(yq '[.[] | select(.path == strenv(PARAMETERS_PATH)) | .value[] | select(.name == strenv(HELM_PARAMETER_NAME))] | length' "$MANIFEST_PATH")
        if [[ "$parameter_count" != 1 ]]; then
          printf 'Expected exactly one matching Helm image tag parameter; found %s\n' "$parameter_count" >&2
          exit 1
        fi

        current_tag=$(yq '.[] | select(.path == strenv(PARAMETERS_PATH)) | .value[] | select(.name == strenv(HELM_PARAMETER_NAME)) | .value' "$MANIFEST_PATH")
        if [[ "$current_tag" == "$IMAGE_TAG" ]]; then
          printf 'Manifest already uses the requested image tag\n'
          exit 0
        fi

        yq -i '(.[] | select(.path == strenv(PARAMETERS_PATH)) | .value[] | select(.name == strenv(HELM_PARAMETER_NAME)) | .value) = strenv(IMAGE_TAG)' "$MANIFEST_PATH"
        git add -- "$MANIFEST_PATH"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m "chore: update $HELM_PARAMETER_NAME to $IMAGE_TAG" -- "$MANIFEST_PATH"
        git pull --rebase origin "$BRANCH"
        git push origin "HEAD:$BRANCH"