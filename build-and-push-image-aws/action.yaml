name: 'Build and Push Container Image'
description: 'Builds and pushes container image to Amazon ECR and, for dev only, Google Artifact Registry'

inputs:
  build_context:
    description: Build context of the dockerfile
    required: false
    default: .
  build_args:
    description: Build arguments
    required: false
  dockerfile_path:
    description: Path to the dockerfile
    required: false
    default: ./Dockerfile
  environment:
    description: Environment name
    required: false
  aws_region:
    description: AWS region for ECR
    required: true
    default: us-east-1
  ecr_repository:
    description: ECR repository name
    required: true
  image_tag:
    description: Image tag
    required: false
  image_name:
    description: Image name
    required: true
  tags:
    description: Tags for the image
    required: true
  aws_access_key_id:
    description: AWS access key ID
    required: true
  aws_secret_access_key:
    description: AWS secret access key
    required: true
  gar_host:
    description: GAR host (required for dev)
    required: false
  gar_project:
    description: GAR project (required for dev)
    required: false
  gar_repository:
    description: GAR repository (required for dev)
    required: false
  gcp_workload_identity_provider:
    description: GCP workload identity provider (required for dev)
    required: false
  gcp_service_account:
    description: GCP service account (required for dev)
    required: false

runs:
  using: "composite"

  steps:
    - name: Validate dev secondary inputs
      if: ${{ inputs.environment == 'dev' }}
      shell: bash
      env:
        gar_host: ${{ inputs.gar_host }}
        gar_project: ${{ inputs.gar_project }}
        gar_repository: ${{ inputs.gar_repository }}
        gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        gcp_service_account: ${{ inputs.gcp_service_account }}
        image_name: ${{ inputs.image_name }}
      run: |
        missing=0
        for input in gar_host gar_project gar_repository gcp_workload_identity_provider gcp_service_account image_name; do
          if [[ -z "${!input//[[:space:]]/}" ]]; then
            printf 'Missing required dev input: %s\n' "$input" >&2
            missing=1
          fi
        done
        exit "$missing"

    - 
      name: 'Configure AWS credentials'
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}
    # - name: Configure AWS Credentials
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     role-to-assume: arn:aws:iam::205930631617:role/backend_githubaction_role
    #     aws-region: us-east-1 

    -
      name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Authenticate to Google Cloud for dev
      if: ${{ inputs.environment == 'dev' }}
      id: gcp-auth
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        create_credentials_file: false
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: Login to GAR for dev
      if: ${{ inputs.environment == 'dev' }}
      id: login-gar
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.gar_host }}
        username: oauth2accesstoken
        password: ${{ steps.gcp-auth.outputs.access_token }}

    - name: Prepare image tags
      id: image-tags
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        IMAGE_NAME: ${{ inputs.image_name }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        GAR_HOST: ${{ inputs.gar_host }}
        GAR_PROJECT: ${{ inputs.gar_project }}
        GAR_REPOSITORY: ${{ inputs.gar_repository }}
      run: |
        images=("$ECR_REGISTRY/$IMAGE_NAME")
        if [[ "$ENVIRONMENT" == dev ]]; then
          images+=("$GAR_HOST/$GAR_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME")
        fi
        if [[ -n "$IMAGE_TAG" ]]; then
          tags=("$IMAGE_TAG")
        elif [[ -n "$ENVIRONMENT" ]]; then
          tags=("$ENVIRONMENT.${GITHUB_SHA::8}-$GITHUB_RUN_NUMBER" latest)
        else
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          tags=("$branch.${GITHUB_SHA::8}-$GITHUB_RUN_NUMBER")
        fi
        for value in "${images[@]}" "${tags[@]}"; do
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            printf 'Image paths and tags must not contain line breaks\n' >&2
            exit 1
          fi
        done
        {
          printf 'tags<<IMAGE_TAGS\n'
          for image in "${images[@]}"; do
            for tag in "${tags[@]}"; do
              printf '%s:%s\n' "$image" "$tag"
            done
          done
          printf 'IMAGE_TAGS\n'
        } >> "$GITHUB_OUTPUT"

    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: linux/amd64

    - 
      name: Set up Docker Context
      shell: bash
      run: docker context create builders

    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: latest
        endpoint: builders
        cache-binary: false

    -
      name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: linux/amd64
        provenance: false
        push: true
        build-args: |
          ${{ inputs.build_args }}
        tags: ${{ steps.image-tags.outputs.tags }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=github.com/${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
